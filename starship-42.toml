# The Hitchhiker's Guide to the Galaxy Theme
# #241442 Cosmic Purple (OS/User)
# #412275 Nebula Purple (Directory)
# #00ffcc Improbability Cyan (Git)
# #39ff14 Towel Green (Languages)
# #ffdb58 Don't Panic Yellow (Time / Highlights)

#           _     _ 
#  ______ _(_) __| |
# |_  / _` | |/ _` |
#  / / (_| | | (_| |
# /___\__,_|_|\__,_|    zaid-hassan (42 Mod)

# ---------------------------------------------------------------
format = """
[░▒▓](#241442)\
$os\
$username\
[](bg:#412275 fg:#241442)\
$directory\
[](fg:#412275 bg:#00ffcc)\
$git_branch\
$git_status\
[](fg:#00ffcc bg:#39ff14)\
$c\
$python\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$php\
[](fg:#39ff14 bg:#1a8cff)\
$docker_context\
[](fg:#1a8cff bg:#ffdb58)\
$time\
[ ](fg:#ffdb58)\
\n
$cmd_duration\
$character\
"""

[line_break]
disabled = false

[username]
show_always = true
style_user = "bg:#241442 fg:#39ff14 bold"
style_root = "bg:#9A348E fg:#ffffff"
format = '[ $user ]($style)'
disabled = false

[os]
style = "bg:#241442 fg:#00ffcc"
disabled = false

[os.symbols]
Manjaro = "󰣇 "

[directory]
style = "bg:#412275 fg:#ffffff"
format = "[ 󰠵 $path ]($style)" # Adicionada uma toalha/ícone antes do caminho
truncation_length = 99
truncation_symbol = ""
truncate_to_repo = false

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#1a8cff fg:#ffffff"
format = '[ $symbol $context ]($style) $path'

[elixir]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = " "
style = "bg:#00ffcc fg:#241442 bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#00ffcc fg:#241442 bold"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[php]
symbol = " "
style = "bg:#39ff14 fg:#241442 bold"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#ffdb58 fg:#241442 bold"
format = '[  $time ]($style)'

[character]
success_symbol = '[ 42 ➜ ](bold #39ff14)'
error_symbol = "[ DON'T PANIC ➜ ](bold red)"

[cmd_duration]
min_time = 500
format = ' [$duration](bold #ffdb58)'
