# Half-Life 2 / HEV Suit Color Palette
# #1c221f OS/User (Dark Industrial)
# #2c2c2c Directory (Armor Gray)
# #d4a359 Git (Warning Amber)
# #557a55 Languages/Versions (Bio-Green)
# #ff9900 Lambda Orange / Highlights

#           _     _ 
#  ______ _(_) __| |
# |_  / _` | |/ _` |
#  / / (_| | | (_| |
# /___\__,_|_|\__,_|    zaid-hassan (HL2 Mod)

# ---------------------------------------------------------------
format = """
[░▒▓](#1c221f)\
$os\
$username\
[](bg:#2c2c2c fg:#1c221f)\
$directory\
[](fg:#2c2c2c bg:#d4a359)\
$git_branch\
$git_status\
[](fg:#d4a359 bg:#557a55)\
$c\
$python\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$php\
[](fg:#557a55 bg:#3b443b)\
$docker_context\
[](fg:#3b443b bg:#2c2c2c)\
$time\
[ ](fg:#2c2c2c)\
\n
$cmd_duration\
$character\
"""

[line_break]
disabled = false

[username]
show_always = true
style_user = "bg:#1c221f fg:#ff9900 bold"
style_root = "bg:#9A348E fg:#ffffff"
format = '[ $user ]($style)'
disabled = false

[os]
style = "bg:#1c221f fg:#ff9900"
disabled = false

[os.symbols]
Manjaro = "󰣇 "

[directory]
style = "bg:#2c2c2c fg:#ffffff"
format = "[ $path ]($style)"
truncation_length = 99
truncation_symbol = ""
truncate_to_repo = false

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#3b443b fg:#ffffff"
format = '[ $symbol $context ]($style) $path'

[elixir]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = " "
style = "bg:#d4a359 fg:#1c221f bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#d4a359 fg:#1c221f bold"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[php]
symbol = " "
style = "bg:#557a55 fg:#1c221f bold"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#2c2c2c fg:#ff9900"
format = '[  $time ]($style)'

[character]
success_symbol = '[ λ ](bold #ff9900)'
error_symbol = '[ λ ](bold red)'

[cmd_duration]
min_time = 500
format = ' [$duration](bold #d4a359)'
